name: iPhone Duo Abhol-Check

on:
  schedule:
    # Reserve: GitHub startet Zeitpläne oft nur alle paar Stunden. Die Hauptkette läuft über den
    # Selbst-Neustart am Ende jedes Laufs (siehe "Nächsten Lauf starten").
    - cron: "*/5 * 23-31 10 *"
    - cron: "*/5 * * 1-9,11-12 *"
  workflow_dispatch:         # manuell über "Run workflow" startbar
    inputs:
      test_push:
        description: "Nur Test-Push aufs Handy senden"
        type: boolean
        default: false

concurrency:
  group: iphone-duo-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # damit sich der Workflow selbst neu starten kann

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub erlaubt max. 6 h pro Job
    steps:
      - uses: actions/checkout@v4

      # Merkt sich bereits gemeldete Treffer, damit nicht alle 5 Minuten erneut gepusht wird
      - name: Status laden
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Test-Push senden
        if: inputs.test_push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py --test-notify

      - name: Alle 5 Minuten prüfen (~5,5 h pro Lauf)
        if: ${{ !inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py --loops 66 --interval 300 --state state.json

      - name: Status speichern
        if: ${{ always() && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # Ein Lauf darf max. 6 h dauern -> am Ende den nächsten starten. Endet erst, wenn der
      # Workflow deaktiviert oder ein Lauf von Hand abgebrochen wird.
      - name: Nächsten Lauf starten
        if: ${{ !cancelled() && !inputs.test_push }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref main

  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
