name: iPhone Duo Abhol-Check

on:
  schedule:
    # GitHub startet Zeitpläne oft nur alle paar Stunden. Darum prüft jeder Lauf bis zu ~5,5 h
    # lang minütlich; die häufigen Starts sorgen nur dafür, dass direkt danach der nächste Lauf folgt.
    - cron: "*/5 * 23-31 10 *"
    - cron: "*/5 * * 1-9,11-12 *"
  workflow_dispatch:         # manuell über "Run workflow" startbar
    inputs:
      test_push:
        description: "Nur Test-Push aufs Handy senden"
        type: boolean
        default: false

concurrency:
  group: iphone-duo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub erlaubt max. 6 h pro Job
    steps:
      - uses: actions/checkout@v4

      # Merkt sich bereits gemeldete Treffer, damit nicht alle 5 Minuten erneut gepusht wird
      - name: Status laden
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Test-Push senden
        if: inputs.test_push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py --test-notify

      - name: Minütlich prüfen (bis ~5,5 h)
        if: ${{ !inputs.test_push }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py --loops 300 --state state.json

      - name: Status speichern
        if: ${{ always() && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
